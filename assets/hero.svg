<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
<style>
.t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
.ln{opacity:0;animation:in .5s ease forwards}
.up{opacity:0;animation:up .8s ease forwards}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.f1{animation:fl 7s ease-in-out infinite}
.f2{animation:fl 9s ease-in-out infinite reverse}
@keyframes fl{50%{transform:translate(18px,-16px)}}
.blink{animation:bl 1s steps(1) infinite;animation-delay:4.2s;opacity:0}
@keyframes bl{0%{opacity:1}50%{opacity:0}}
.pulse{animation:pu 2s ease-in-out infinite}
@keyframes pu{50%{opacity:.35}}
.shine{animation:sh 6s linear infinite}
@keyframes sh{from{transform:translateX(-400px)}to{transform:translateX(700px)}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0c1d3a"/></linearGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset=".55" stop-color="#a371f7"/><stop offset="1" stop-color="#f778ba"/></linearGradient>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<clipPath id="card"><rect width="1000" height="340" rx="22"/></clipPath>
<mask id="nmask"><text x="60" y="190" class="t" font-size="66" font-weight="800" fill="#fff">José Gomes</text></mask>
</defs>
<g clip-path="url(#card)">
<rect width="1000" height="340" fill="url(#bg)"/>
<rect width="1000" height="340" fill="url(#grid)"/>
<circle class="f1" cx="180" cy="60" r="110" fill="#1f6feb" opacity=".35" filter="url(#blur)"/>
<circle class="f2" cx="520" cy="320" r="120" fill="#a371f7" opacity=".28" filter="url(#blur)"/>
<circle class="f1" cx="930" cy="40" r="90" fill="#f778ba" opacity=".18" filter="url(#blur)"/>
</g>
<rect x=".75" y=".75" width="998.5" height="338.5" rx="22" fill="none" stroke="#30363d" stroke-width="1.5"/>
<g class="up" style="animation-delay:.1s"><text x="62" y="112" class="t" font-size="22" fill="#8b949e">Olá, eu sou o</text></g>
<g class="up" style="animation-delay:.3s">
<text x="60" y="190" class="t" font-size="66" font-weight="800" fill="url(#nm)">José Gomes</text>
<g mask="url(#nmask)"><rect class="shine" x="0" y="120" width="160" height="90" fill="url(#sw)"/></g>
</g>
<g class="up" style="animation-delay:.55s"><text x="62" y="232" class="t" font-size="22" font-weight="600" fill="#e6edf3">Estudante de Programação</text></g>
<g class="up" style="animation-delay:.8s">
<rect x="62" y="258" width="150" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
<text x="137" y="280" class="t" font-size="14" fill="#c9d1d9" text-anchor="middle">Porto, Portugal</text>
<rect x="224" y="258" width="190" height="34" rx="17" fill="#0f2a1a" stroke="#238636"/>
<circle class="pulse" cx="244" cy="275" r="5" fill="#3fb950"/>
<text x="327" y="280" class="t" font-size="14" fill="#7ee787" text-anchor="middle">Aberto a estágios</text>
</g>
<g class="up" style="animation-delay:.2s">
<rect x="560" y="44" width="400" height="266" rx="14" fill="#010409" fill-opacity=".85" stroke="#30363d"/>
<path d="M560 58a14 14 0 0 1 14-14h372a14 14 0 0 1 14 14v18H560z" fill="#161b22"/>
<circle cx="582" cy="60" r="6" fill="#ff5f57"/><circle cx="602" cy="60" r="6" fill="#febc2e"/><circle cx="622" cy="60" r="6" fill="#28c840"/>
<text x="760" y="65" class="m" font-size="13" fill="#8b949e" text-anchor="middle" style="font-size:13px">jose@github: ~</text>
</g>
<text x="590" y="108" class="m ln" style="animation-delay:0.6s"><tspan fill="#3fb950">➜ </tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#c9d1d9"> whoami</tspan></text>
<text x="590" y="134" class="m ln" style="animation-delay:1.2s"><tspan fill="#58a6ff">jose-gomes</tspan></text>
<text x="590" y="166" class="m ln" style="animation-delay:1.8s"><tspan fill="#3fb950">➜ </tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#c9d1d9"> cat stack.txt</tspan></text>
<text x="590" y="192" class="m ln" style="animation-delay:2.4s"><tspan fill="#d2a8ff">Java · Python · JavaScript · SQL</tspan></text>
<text x="590" y="224" class="m ln" style="animation-delay:3.0s"><tspan fill="#3fb950">➜ </tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#c9d1d9"> git commit -m &quot;sempre a aprender&quot;</tspan></text>
<text x="590" y="250" class="m ln" style="animation-delay:3.6s"><tspan fill="#3fb950">[main] +1 projeto, +1 skill</tspan></text>
<text x="590" y="282" class="m ln" style="animation-delay:4.2s"><tspan fill="#3fb950">➜ </tspan><tspan fill="#58a6ff">~</tspan></text>
<rect class="blink" x="622" y="269" width="9" height="17" fill="#c9d1d9"/>
</svg>
